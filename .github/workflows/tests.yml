name: Tests

on:
  push:
    branches:
      - tests/coverage-85
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install coverage provider
        run: npm install --no-save @vitest/coverage-v8

      - name: Run tests with coverage
        run: npm test -- --watch=false --coverage
