<app-auth-layout
    title="Crie sua conta"
    primaryButtonText="REGISTRAR"
    [isLoading]="isLoading()"
    (submitClicked)="submit()">

    <form auth-form [formGroup]="registerForm">

        <app-input-forms
            type="text"
            placeholder="Nome"
            [control]="registerForm.controls.name">
        </app-input-forms>

        <app-input-forms
            type="email"
            placeholder="E-mail"
            [control]="registerForm.controls.email">
        </app-input-forms>

        <app-input-forms
            type="password"
            placeholder="Senha"
            [control]="registerForm.controls.password">
        </app-input-forms>

        <div class="confirm-password-field">
            <app-input-forms
                type="password"
                placeholder="Confirmar senha"
                [control]="registerForm.controls.confirmPassword">
            </app-input-forms>

            <div class="password-message">
                @if (passwordMismatchMessage; as message) {
                    <p class="password-error-message">{{ message }}</p>
                }
            </div>
        </div>

        <div class="form-message">
            @if (errorMessage()) {
                <p class="error-message">{{ errorMessage() }}</p>
            }

            @if (successMessage()) {
                <p class="success-message">{{ successMessage() }}</p>
            }
        </div>

    </form>

    <div class="auth-footer" auth-footer>
        <span class="login-text">Já tem uma conta?</span>

        <a class="login-link" routerLink="/login">
            Faça login
        </a>
    </div>

</app-auth-layout>
