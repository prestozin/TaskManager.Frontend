<div class="container">

    <div class="container-header">
        <div class="header-top">

            <h2 class="header-title">Minhas Tarefas</h2>

        </div>

        <div class="container-filter-new-task">
            <div class="task-filters">

                <div class="filter-field">
                    <p class="filter-label">Pesquisar</p>

                    <div class="search-container">

                        <img class="icon-search" src="icons/search-icon.svg" alt="">

                        <input 
                            class="search-input" 
                            type="search" 
                            placeholder="Pesquisar tarefas..."
                            [formControl]="searchControl">
                    </div>

                </div>

                <app-dropdown 
                    class="priority-dropdown"
                    label="Prioridade" 
                    [options]="priorityOptions()" 
                    [selectedOption]="selectedPriority()"
                    (optionSelected)="selectPriority($event)">
                </app-dropdown>

                <app-dropdown 
                    class="status-dropdown"
                    label="Status"
                    [options]="statusOptions()" 
                    [selectedOption]="selectedStatus()"
                    (optionSelected)="selectStatus($event)">
                </app-dropdown>

            </div>

            <button class="btn-newtask" (click)="createNewTask()">
                <img src="icons/plus-icon.svg" alt="">
                <p>Nova Tarefa</p>
            </button>

        </div>

    </div>

    <div class="task-container">

        <label class="checkbox">
            <input class="checkbox-input" type="checkbox" [formControl]="allTasksControl">
        </label>

        <p class="prop-task">Tarefas</p>
        <p class="prop-align prop-task" (click)="orderTasks(TaskSort.CreatedAt)">Data de Criação</p>
        <p class="prop-align prop-task" (click)="orderTasks(TaskSort.TaskPriority)">Prioridade</p>
        <p class="prop-align prop-task" (click)="orderTasks(TaskSort.TaskStatus)">Status</p>
        <div empty-column></div>

    </div>

    <div class="tasks-wrapper">
        @for (task of tasks(); track task.id) {
        <app-task [task]="task"></app-task>
        }
    </div>

</div>

<footer class="container-footer">
    <p class="footer-text">Mostrando {{ tasks().length }} de {{ pagedResponse()?.totalCount ?? 0 }} tarefas</p>

    <div class="footer-buttons">

        <p>Páginas: </p>

        <button class="first-page btn-pages" (click)="changePage(1)"> << </button>
        <button class="previous-page btn-pages" (click)="changePage(currentPage() - 1)"> < </button>

        @for (page of visiblePages(); track page) 
        {
            <button class="btn-pages" [class.active]="currentPage() === page" (click)=" changePage(page)"> {{ page }} </button> 
        }

        <input 
            #pageInputElement 
            class="choose-page btn-pages" 
            type="number" placeholder="__" 
            [formControl]="pageInput" min="1" [max]="pagedResponse()?.totalPages ?? 1"
            (keydown.enter)="goToPage(pageInputElement)" 
            (blur)="pageInput.reset()">

    <button class="next-page btn-pages" (click)="changePage(currentPage() + 1)"> > </button>
    <button class="last-page btn-pages" (click)="changePage(pagedResponse()?.totalPages ?? 1)"> >> </button>

    </div>
</footer>
