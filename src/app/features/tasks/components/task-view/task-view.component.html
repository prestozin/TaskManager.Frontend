<div class="container">

    <p class="container-title">Detalhes da tarefa</p>

    <div class="task-infos">

        <div class="task-title-wrapper">
            <p class="field-label">Título:</p>
            <p class="task-title">{{ title() }}</p>
        </div>

        <div class="task-date-wrapper">
            <p class="field-label">Data de criação:</p>
            <p class="task-date">{{ task().createdAt | date:'dd/MM/yyyy' }}</p>
        </div>

        <div class="task-priority-wrapper">
            <p class="field-label">Prioridade:</p>

            <p class="task-priority priority" [ngClass]="priorityClass()">
                {{ priority() }}
            </p>
        </div>

        <div class="task-status-wrapper">
            <p class="field-label">Status:</p>

            <p class="task-status status" [ngClass]="statusClass()">
                {{ status() }}
            </p>
        </div>

        <div class="task-description-wrapper">
            <p class="field-label">Descrição:</p>
            <p class="task-description">{{ description() }}</p>
        </div>

    </div>

    <div class="buttons">

        <div class="delete-wrapper">
            <button
                class="btn-delete"
                type="button"
                (click)="deleteTaskClicked.emit()">
                Excluir tarefa
            </button>
        </div>

        <button
            class="btn-edit"
            type="button"
            (click)="editTaskClicked.emit()">
            Editar
        </button>

        <button
            class="btn-close"
            type="button"
            (click)="closeClicked.emit()">
            Fechar
        </button>

    </div>

</div>
