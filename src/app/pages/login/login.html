<app-auth-layout
title = "Bem-vindo(a)!"
primaryButtonText = "LOGIN"
(submitClicked)="submit()">

    <form auth-form [formGroup]="loginForm">

        <app-primary-input
            type="email"
            placeholder="Endereço de email"
            [control]="loginForm.controls.email">
        </app-primary-input>

        <app-primary-input
            type="password"
            placeholder="Senha"
            [control]="loginForm.controls.password">
        </app-primary-input>

        <a class="forgot-password" routerLink="/forgot-password"> Esqueceu sua senha? </a>

    </form>

    <div auth-footer class="auth-footer">
        <span class="footer-text">Não possui uma conta?</span>
        <a class="textLink" routerLink="/register">Criar conta</a>
    </div>

</app-auth-layout>
