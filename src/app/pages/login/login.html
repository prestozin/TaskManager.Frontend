<app-auth-layout
title = "Bem-vindo(a)!"
primaryButtonText = "LOGIN"
primaryLinkText = "Esqueceu sua senha?"
secondaryLinkText = "Criar uma conta"
(submitClicked)="submit()">

    <form auth-form [formGroup]="loginForm">

        <app-primary-input
            type="email"
            placeholder="Digite seu e-mail"
            [control]="loginForm.controls.email">
        </app-primary-input>

        <app-primary-input
            type="password"
            placeholder="Digite sua senha"
            [control]="loginForm.controls.password">
        </app-primary-input>

    </form>

</app-auth-layout>
