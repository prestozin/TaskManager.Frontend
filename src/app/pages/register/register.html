<app-auth-layout
title = "Crie sua conta"
primaryButtonText = "REGISTRAR"
textLink = "Já tem uma conta? Faça login"
(submitClicked)="submit()">

<form auth-form [formGroup]="registerForm">

        <app-primary-input
            type="text"
            placeholder="Nome"
            [control]="registerForm.controls.name">
        </app-primary-input>
        
        <app-primary-input
            type="email"
            placeholder="E-mail"
            [control]="registerForm.controls.email">
        </app-primary-input>

        <app-primary-input
            type="password"
            placeholder="Senha"
            [control]="registerForm.controls.password">
        </app-primary-input>

        <app-primary-input
            type="password"
            placeholder="Confirmar senha"
            [control]="registerForm.controls.password">
        </app-primary-input>

    </form>

</app-auth-layout>
