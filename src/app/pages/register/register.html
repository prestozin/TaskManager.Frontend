<app-auth-layout
title = "Crie sua conta"
primaryButtonText = "REGISTRAR"
secondaryLinkText = "Já tem uma conta? Faça login">

<form auth-form [formGroup]="registerForm">

        <app-primary-input
            type="text"
            placeholder="Digite seu nome"
            [control]="registerForm.controls.name">
        </app-primary-input>
        
        <app-primary-input
            type="email"
            placeholder="Digite seu e-mail"
            [control]="registerForm.controls.email">
        </app-primary-input>

        <app-primary-input
            type="password"
            placeholder="Digite sua senha"
            [control]="registerForm.controls.password">
        </app-primary-input>

        <app-primary-input
            type="password"
            placeholder="Confirme sua senha"
            [control]="registerForm.controls.password">
        </app-primary-input>

    </form>

</app-auth-layout>
