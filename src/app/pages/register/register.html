<app-auth-layout
title = "Crie sua conta"
primaryButtonText = "REGISTRAR"
textLink = "Faça login"
linkRoute = "/login"
(submitClicked)="submit()">

    <form auth-form [formGroup]="registerForm">

        <app-input-forms
            type="text"
            placeholder="Nome"
            [control]="registerForm.controls.name">
        </app-input-forms>
        
        <app-input-forms
            type="email"
            placeholder="E-mail"
            [control]="registerForm.controls.email">
        </app-input-forms>

        <app-input-forms
            type="password"
            placeholder="Senha"
            [control]="registerForm.controls.password">
        </app-input-forms>

        <app-input-forms
            type="password"
            placeholder="Confirmar senha"
            [control]="registerForm.controls.password">
        </app-input-forms>

    </form>

    <div auth-footer class="auth-footer">
        <span class="footer-text">Já tem uma conta?</span>
        <a class="textLink" routerLink="/login">Faça login</a>
    </div>

</app-auth-layout>
