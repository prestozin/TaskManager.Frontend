<div class="container">
    <p class="dropdown-title">{{ label() }}</p>

    <div class="dropdown" [class.open]="isOpen" (click)="toggleDropdown()">
        <p class="dropdown-text" [class.selected]="selectedOption()">
            {{ selectedOption()?.name ?? placeholder() }}
        </p>
        <svg lucideChevronDown class="dropdown-arrow"></svg>

        @if (isOpen) {
        <div class="dropdown-options">
            @for (option of options(); track option.id)
            {
            @if (option.id !== selectedOption()?.id) {
            <p class="dropdown-option" (click)="selectOption(option); $event.stopPropagation()">
                {{ option.name }}
            </p>
            }
            }
        </div>
        }
    </div>

</div>
