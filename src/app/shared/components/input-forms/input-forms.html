@if (isTextarea()) {
    <textarea
        class="form-control"
        [formControl]="control()"
        [placeholder]="placeholder()"
        [maxlength]="maxLength()"
        [class.invalid]="isInvalid">
    </textarea>
}
@else {
    <div class="input-wrapper">
        <input
            class="form-control"
            [type]="inputType()"
            [formControl]="control()"
            [placeholder]="placeholder()"
            [maxlength]="maxLength()"
            [class.invalid]="isInvalid">

        @if (type() === 'password') {
            <button
                type="button"
                class="password-toggle"
                [attr.aria-label]="isPasswordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
                (click)="togglePasswordVisibility()">
                <nz-icon
                    [nzType]="isPasswordVisible() ? 'eye-invisible' : 'eye'"
                    nzTheme="outline">
                </nz-icon>
            </button>
        }
    </div>
}

<div class="error-message">
    @if (errorMessage; as message) {
        <p>{{ message }}</p>
    }
</div>
