<div class="container">

    <div class="container-header">
        <div class="header-top">

            <h2 class="header-title">Minhas Tarefas</h2>

            <div class="search-new-task-container">
                <div class="search-container">
                    <img src="" alt="">
                    <input class="search-input" type="search" placeholder="Pesquisar tarefas..."
                        [formControl]="searchControl">
                </div>

                <button class="btn-newtask">
                    <p>Nova Tarefa</p>
                    <img src="" alt="">
                </button>

            </div>

        </div>

        <div class="task-filters">
            <p>Todas</p>
            <p>Pendentes</p>
            <p>Concluidas</p>
        </div>

    </div>

    <div class="task-container">

        <label class="checkbox">
            <input class="checkbox-input" type="checkbox" [formControl]="allTasksForm.controls.completed">
        </label>

        <p class="prop-task">Tarefa</p>
        <p class="prop-align prop-task">Data de Criação</p>
        <p class="prop-align prop-task">Prioridade</p>
        <p class="prop-align prop-task">Status</p>
        <div empty-column></div>

    </div>

    <div class="tasks-wrapper">
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
        <app-task></app-task>
    </div>

</div>
