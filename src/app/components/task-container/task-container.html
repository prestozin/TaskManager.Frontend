<div class="container">

    <div class="container-header">
        <div class="header-top">

            <h2 class="header-title">Minhas Tarefas</h2>

            <div class="search-new-task-container">
                <div class="search-container">
                    <img class="icon-search" src="icons/search-icon.svg" alt="">
                    <input class="search-input" type="search" placeholder="Pesquisar tarefas..."
                        [formControl]="searchControl">
                </div>

                <button class="btn-newtask">
                    <img src="icons/plus-icon.svg" alt="">
                    <p>Nova Tarefa</p>

                </button>

            </div>

        </div>

        <div class="task-filters">

            <p [class.active]="activeFilter === 'all'" (click)="setFilter('all')">
                Todas
            </p>

            <p [class.active]="activeFilter === 'pending'" (click)="setFilter('pending')">
                Pendentes
            </p>

            <p [class.active]="activeFilter === 'completed'" (click)="setFilter('completed')">
                Concluidas
            </p>

        </div>

    </div>

    <div class="task-container">

        <label class="checkbox">
            <input class="checkbox-input" type="checkbox" [formControl]="allTasksForm.controls.completed">
        </label>

        <p class="prop-task">Tarefas</p>
        <p class="prop-align prop-task">Data de Criação</p>
        <p class="prop-align prop-task">Prioridade</p>
        <p class="prop-align prop-task">Status</p>
        <div empty-column></div>

    </div>

    <div class="tasks-wrapper">
        @for (task of visibleTasks; track task.id) {
            <app-task [task]="task"></app-task>
        }
    </div>

</div>

<footer class="container-footer">
    <p class="footer-text">Mostrando 1 de 54 tarefas</p>

    <div class="footer-buttons">

        <button> >> </button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>...</button>
        <button>
            << </button>

    </div>
</footer>
