
<div class="task">

    <label class="checkbox">
        <input type="checkbox" [formControl]="taskForm.controls.completed"> 
    </label>

    <div class="task-info">
        <p class="task-title">{{ task().title }}</p>
        <p class="description">{{ task().description }}</p>
    </div>

               
    <p class="task-details date">{{ task().createdAt }}</p>
    <p class="task-details priority">{{ task().priority }}</p>
    <p class="task-details status"> {{ task().status }} </p>
    <img class="btn-options " src="icons/task-dots.svg" alt=""> 
    
</div>
