
<div class="task">

    <label class="checkbox">
        <input type="checkbox" [formControl]="taskForm.controls.completed"> 
    </label>

    <div class="task-info">
        <p class="task-title">{{   truncateText(capitalizeFirst(task().title))  }}</p>
        <p class="description">{{  truncateText(capitalizeFirst(task().description)) }}</p>
    </div>

               
    <p class="task-details date">{{ task().createdAt | date:'dd/MM/yyyy' }}</p>
    <p class="task-details priority" [ngClass]="'priority-' + normalizeClass(task().priority)">{{ capitalizeFirst(task().priority) }}</p>
    <p class="task-details status" [ngClass]="'status-' + normalizeClass(task().status)"> {{ capitalizeFirst(task().status) }} </p>
    <img class="btn-options " src="icons/task-dots.svg" alt=""> 
    
</div>
